import java.util.Properties

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Подпись release читается из key.properties (кладётся в корень проекта или на уровень выше).
// Формат: storeFile, storePassword, keyAlias, keyPassword
def keystoreProps = new Properties()
def keystorePropsFile = [rootProject.file("key.properties"), rootProject.file("../key.properties"), file("key.properties")].find { it.exists() }
if (keystorePropsFile != null) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def resolvedStoreFile = null
if (keystoreProps.getProperty("storeFile")) {
    def candidate = new File(keystoreProps.getProperty("storeFile"))
    resolvedStoreFile = candidate.isAbsolute() ? candidate :
        [new File(keystorePropsFile.parentFile, candidate.path), rootProject.file(candidate.path), file(candidate.path)].find { it.exists() }
}
def useReleaseSigning = resolvedStoreFile != null && resolvedStoreFile.exists() &&
        keystoreProps.getProperty("storePassword") && keystoreProps.getProperty("keyAlias")

android {
    namespace "com.unzipgit.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.unzipgit.app"
        minSdk 24
        targetSdk 34
        versionCode 35
        versionName "3.23"
    }

    signingConfigs {
        if (useReleaseSigning) {
            release {
                storeFile resolvedStoreFile
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword") ?: keystoreProps.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            // Без key.properties берём debug-ключ, чтобы APK можно было установить
            signingConfig useReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources.excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE", "META-INF/LICENSE.txt", "META-INF/NOTICE", "META-INF/NOTICE.txt"]
        // дубли нативных библиотек не должны ронять сборку (pickFirst)
        jniLibs.pickFirsts += ["lib/**/*.so"]
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
}
